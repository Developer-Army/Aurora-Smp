# LifeSteal Plugin Configuration - DonutSMP Standard
# Aurora SMP 1.21.1

heart-item-name: "<#ff416c>&l❤ <#ff4b2b>&lHeart"

# Maximum health in HP (40 HP = 20 Hearts, DonutSMP standard)
max-health: 40
min-health: 2

# Feature Toggles
ban-on-zero-hearts: true

# Messages
messages:
  no_hearts: "<red>You don't have enough hearts to withdraw!"
  success_withdraw: "<green>Successfully withdrew a heart item!"
  success_redeem: "<green>You redeemed %amount% heart(s)!"
  reset_success: "<green>%player%'s hearts have been reset to default!"
  already-active: "&cYou already have an active revive beacon."
  ritual-start: "&7Revive ritual activated. Type a banned player name in chat to revive."
  player-not-banned: "&cThat player is not eliminated."
  revive-success: "<green>Successfully revived &l{player}&a!"

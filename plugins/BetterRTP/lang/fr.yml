Messages:
  Locked: '&cSDésolé ! &7Vous avez utilisé tous vos RTP''s !'
  Edit:
    Error: '&cErreur ! &cEntrée invalide !'
    Set: '&aSuccès ! %type% définie sur %value%'
    Remove: '&cRetiré ! Vous avez retiré le Monde Custom %world%'
  Prefix: '&7[&6BetterRTP&7] '
  # # Placeholders! %x% %y% et %z% sont les coordonées x, y, et z auxquelles le joueur sera téléporté! #
  Success:
    Teleport: '&aTéléportation... &fMerci de patienter pendant la recherche d''un
      endroit sûr !'
    Paid: '&aTu a été téléporté à&7 x=%x% y=%y% z=%z% pour &c$%price%&7 en &f%attempts%
      &7tentatives!'
    Bypass: '&aTu a été téléporté à&7 x=%x% y=%y% z=%z% en &f%attempts% &7tentatives!'
    Loading: '&aSafe spot located! &7Loading chunks...'
  Failed:
    Hunger: '&cImpossible de vous téléporter car vous avez trop faim, manger pour
      remplir votre barre de nourriture !'
    Price: '&cTu n''a pas pu être téléporté; Manque de fonds! &7Tu doit avoir au moins
      $%price% &7pour te téléporter!'
    NotSafe: '&cImpossible de trouver un endroit sûr en %attempts% tentatives! &7Tu
      n''a pas été téléporté!'
  Other:
    Biome: '&cIl demblerais que le biome &7%biome% &cn''existe pas ! &7Utiliser l''autocomplétion
      de la Tab list !'
    Success: '&a%player% a été téléporté à&7 x=%x% y=%y% z=%z% em &f%attempts% &7tentatives!'
    NotSafe: '&cImpossible de trouver un endroit sûr en %attempts% tentatives! &7%player%
      n''a pas été téléporté!'
  Reload: '&eConfiguration rechargée avec succès!'
  NoPermission:
    Basic: '&cDésoler! &7Il te manque la permission pour utiliser cette commande'
    World: '&cDésoler! &7Tu n''est pas autorisé à te téléporter dans le monde %world%
      !'
  # # %world% Est le monde dans lequel le joueur est téléporter ! #
  DisabledWorld: '&cLe monde %world% est désactivé! &7Impossible de se téléporter!'
  Cooldown: '&cDésoler! &7Tu ne peut pas te téléporter pour encore &c%time% &7secondes!'
  Invalid: '&cArgument invalide. Essaye ''/%command% help'''
  NotOnline: '&cLe joueur &7%player% &cn''est pas en ligne!'
  Delay: '&aTéléportation dans &f%time% &asecondes! Ne bouge pas!'
  Moved: '&cTu a bougé! &7Téléportation annulée!'
  NotExist: '&cLe monde &7%world% &cn''existe pas!'
  Already: '&cOups! &7Il semblerait que tu essaie déjà de te téléporter...Patiente
    un peu!'
  Sign: '&7Command sign has been created! &7Command is... ''&f/rtp %command%&7'''

Titles:
  Enabled: true
  Delay:
    # # Paramètre pour aussi envoyer le message dans le chat, ignore le "Enabled" Paramètre #
    SendChatMessage: true
    # # Soutien le %player% "placeholders" #
    Title: '&6BetterRTP par SRC'
    Subtitle: '&fTéléportation dans %time% secondes!'
  Success:
    # # Paramètre pour aussi envoyer le message dans le chat, ignore le "Enabled" Paramètre #
    SendChatMessage: true
    # # Soutien le %player% %x% %y% et %z% "placeholders" #
    Title: '&6BetterRTP par SRC &7(%attempts%)'
    Subtitle: '&fTéléportation vers x=%x% y=%y% z=%z%'

Help:
  Prefix: '&e&m-----&6&l BetterRTP &8| Aide &e&m-----'
  Main: ' &7- &e/%command% &7- Téléportez vous aléatoirement'
  Biome: ' &7- &e/%command% biome <biome1, biome2...> &7- Téléportez vous aléatoirement
    parmi ces biomes'
  Edit: ' &7- &e/%command% edit <default/world> [args...] &7- Modifiez quelques paramètres
    du plugin'
  Help: ' &7- &e/%command% help &7- Affichez l''aide'
  Info: ' &7- &e/%command% info [world/particles/shapes/potion_effects] &7- Visualisez
    les infos du plugin sur des paramètres spécifiques'
  Settings: ' &7- &e/%command% settings &7- Afficher une interface pour modifier des
    paramètres'
  Test: ' &7- &e/%command% test &7- Testez les effets du plugin après une téléportation
    sans bouger'
  Version: ' &7- &e/%command% version &7- Voir la version en cours d''exécution'
  Location: ' &7- &e/%command% location <location_name> &7- Téléporté vous en utilisant
    une location spécidfique'
  List:
  - '&e&m------&r &6&lBetterRTP &8| &7Aide &e&m------'
  - ' &7- &e/%command% &7- Te téléporte aléatoirement'
  - ' &7- &e/%command% help &7- Affiche l''aide'
  # #Si le joueur a la permission de téléporter un autre joueur, ce message s'affiche dans l'aide aussi!
  Player: ' &7- &e/%command% player <joueur> [monde] &7- Téléporte aléatoirement un
    autre joueur'
  World: ' &7- &e/%command% world <monde> &7- Te téléporte aléatoirement dans un autre
    monde'
  # #Si le joueur a la permission de recharger le plugin, ce message s'affiche dans l'aide aussi!
  Reload: ' &7- &e/%command% reload &7- Recharge le plugin!'

Usage:
  Location: '&cUtilisation &7: /%command% location <location_name>'
  Edit:
    PermissionGroup: '&cUsage&7: /%command% edit permission_group <group> <world>
      <max/min/useworldborder/center> <value>'
    Location: '&cUsage&7: /%command% edit location <location_name> <max/min/useworldborder/center>
      <value>'
    Base: '&cUtilisation &7: /%command% edit <default/world> [args...]'
    Default: '&cUtilisation &7: /%command% edit default <max/min/useworldborder/center>
      <value>'
    World: '&cUtilisation &7: /%command% edit world <world> <max/min/useworldborder/center>
      <value>'
    #    PermissionGroup: '&cUsage&7: /%command% edit permission_group <group> <world> <max/min/useworldborder/center> <value>'
    Worldtype: '&cUtilisation  &7: /%command% edit world_type <world> <NETHER/NORMAL>'
    Override: '&cUtilisation  &7: /%command% edit override <world> <world_to>'
    BlacklistedBlocks: '&cUtilisation  &7: /%command% edit blacklistedblocks <add/remove>
      <block_id>'
  Player: '&cUtilisation&7: /%command% player <joeur> [monde]'
  World: '&cUtilisation&7: /%command% world <monde>'
  Biome: '&cUtilisation&7: /%command% biome <biome1, biome2...>'

Sounds:
  Enabled: true
  # # Plus de sons à https://www.spigotmc.org/wiki/cc-sounds-list/ ## Son à jouer lors de la téléportation avec délai ##
  Delay: entity_tnt_primed
  # #Son à jouer lorsque la téléportation à réussie ##
  Success: entity_generic_explode

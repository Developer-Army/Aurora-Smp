Messages:
  Locked: '&cК сожалению, Вы истратили все свои рандомные телепортации.'
  Edit:
    Error: '&cОшибка! &7Введены неверные значения.'
    Set: '&bУспех! &7%type% установлен на %value%'
    Remove: '&cУдалено! &7Вы удалили нестандартный мир %world%'
  Prefix: '&7[&6BetterRTP&7] '
  Success: # # Placeholders! %x% %y% and %z% are the x, y, and z coordinates that the player is being teleported to! #
    Teleport: '&aТелепортация... &7Пожалуйста, подождите, пока будет найдено безопасное
      место.'
    Paid: '&aВас телепортировало на&7 x=%x% y=%y% z=%z% за &c$%price%&7, за &f%attempts%
      &7попыток!'
    Bypass: '&aВас телепортировало на&7 x=%x% y=%y% z=%z% за &f%attempts% &7попыток'
    Loading: '&aSafe spot located! &7Loading chunks...'
  Failed:
    Hunger: '&cНевозможно телепортировать – вы слишком &7голодны!&c Поешьте прежде.'
    Price: '&cУ вас недостаточно денег для телепортации! &7У вас должно быть хотябы
      $%price% &7для rtp!'
    NotSafe: '&cНе удалось найти безопасное место за %attempts% попыток! &7Вас не
      телепортировало!'
  Other:
    Success: '&a%player% был телепортирован на&7 x=%x% y=%y% z=%z% за &f%attempts%
      &7попыток!'
    NotSafe: '&cНе удалось найти безопасное место за %attempts% попыток! &7%player%
      не был телепортирован!'
    Biome: '&cSeems like the biome&7 %biome%&c does not exist! &7Try using the tab
      list!'
  Reload: '&eКонфиг удачно перезагружен!'
  NoPermission:
    Basic: '&cИзвините! &7У вас недостаточно прав для использования этой команды!'
    World: '&cИзвините! &7Вам запрещено использовать rtp в мире %world%!'
  # # %world% is the world the player is in that is disabled to rtp in! #
  DisabledWorld: '&cОтключенный мир %world%! &7Не удалось телепортироваться!'
  Cooldown: '&cИзвините! &7Вы не сможете использовать rtp ближайшие &c%time% &7сек.!'
  Invalid: '&cНеправильные параметры. Попробуйте ''/%command% help'''
  NotOnline: '&cИгрок &7%player% &cне онлайн!'
  Delay: '&aТелепортация через &f%time% &aсек.! Не двигайтесь!'
  Moved: '&cВы подвинулись! &7RTP отменено!'
  NotExist: '&cПохоже что мир &7%world% &cне существует!'
  Already: '&cУуупс! &7Похоже вы уже телепортируетесь. Имейте терпение!'
  Sign: '&7Command sign has been created! &7Command is... ''&f/rtp %command%&7'''

Titles:
  Enabled: true
  Delay:
    # # Setting to also send the chat message, ignores the Enabled setting
    SendChatMessage: true
    # # Both support %player% placeholders
    Title: '&6BetterRTP от SRC'
    Subtitle: '&fТелепортация через %time% сек.!'
  Success:
    # # Setting to also send the chat message, ignores the Enabled setting
    SendChatMessage: true
    # # Both support %player% %x% %y% and %z% placeholders
    Title: '&6BetterRTP от SRC &7(%attempts%)'
    Subtitle: '&fТелепортация к x=%x% y=%y% z=%z%'

Help:
  Location: ' &7- &e/%command% location <location_name> &7- Rtp using a specific location'
  Prefix: '&e&m-----&6&l BetterRTP &8| Помощь &e&m-----'
  Main: ' &7- &e/%command% &7- телепортирует Вас в рандомное место!'
  Edit: ' &7- &e/%command% edit <default/world> [аргументы...] &7- настройка некоторых
    данных плагина'
  Help: ' &7- &e/%command% help &7- отображает список команд'
  Info: ' &7- &e/%command% info [world/particles/shapes/potion_effects] &7- отображает
    информацию о конкретных параметрах'
  Settings: ' &7- &e/%command% settings &7- отобразить GUI и некоторые параметры'
  Test: ' &7- &e/%command% test &7- протестировать эффект плагина после телелепортации'
  Version: ' &7- &e/%command% version &7- отобразить текущую версию плагина'
  List:
  - '&e&m------&r &6&lBetterRTP &8| &7Помощь &e&m------'
  - ' &7- &e/%command% &7- случайно телепортирует вас!'
  - ' &7- &e/%command% help &7- показывает этот список'
  # #If the player has permission to rtp another player, this message will be added under the list!
  Player: ' &7- &e/%command% player <игрок> [мир] &7- случайно телепортирует игрока'
  World: ' &7- &e/%command% world <мир> &7- случайно телепортирует в другой мир'
  # #If the player has permission to reload the plugin this message will be added under the list!
  Biome: ' &7- &e/%command% biome <biome1, biome2...> &7- Randomly teleport withing
    these biomes'
  Reload: ' &7- &e/%command% reload &7- перезагружает плагин'

Usage:
  Location: '&cUsage&7: /%command% location <location_name>'
  Edit:
    PermissionGroup: '&cUsage&7: /%command% edit permission_group <group> <world>
      <max/min/useworldborder/center> <value>'
    Location: '&cUsage&7: /%command% edit location <location_name> <max/min/useworldborder/center>
      <value>'
    Worldtype: '&cUsage&7: /%command% edit world_type <world> <NETHER/NORMAL>'
    Override: '&cUsage&7: /%command% edit override <world> <world_to>'
    BlacklistedBlocks: '&cUsage&7: /%command% edit blacklistedblocks <add/remove>
      <block_id>'
    Base: '&cUsage&7: /%command% edit <default/world> [аргументы...]'
    Default: '&cUsage&7: /%command% edit default <max/min/useworldborder/center> <value>'
    World: '&cUsage&7: /%command% edit world <world> <max/min/useworldborder/center>
      <value>'
  Player: '&cИспользование&7: /%command% player <игрок> [мир]'
  World: '&cИспользование&7: /%command% world <мир>'
  Biome: '&cUsage&7: /%command% biome <biome1, biome2...>'

Sounds:
  Enabled: true
  # # More sounds at https://www.spigotmc.org/wiki/cc-sounds-list/
  Delay: entity_tnt_primed
  Success: entity_generic_explode
